<img src="img/cover.jpg"><h1>學生會長是前世的勇者｜有聲書</h1><p>《學生會長是前世的勇者》有聲書。開學典禮上，我打瞌睡說了一句夢話——「蕾娜，別哭。」台上的學生會長，講稿從手上滑了下去。前世，她是斬殺魔王的勇者；今生，她是全校第一的學生會長，而我是她的雜務組。完美學生會長 × 嘴毒魔王雜務組，雙視角輪流登場的死對頭校園戀愛喜劇。</p><p>RSS：<a href="feed.xml">https://ntcloudy.github.io/brave-podcast/feed.xml</a></p><ol></ol>
